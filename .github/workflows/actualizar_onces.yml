name: Actualizar Onces FutbolFantasy

on:
  schedule:
    # Se ejecutará automáticamente todos los días a las 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch: # Te permite lanzarlo manualmente desde la web de GitHub cuando quieras

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install axios cheerio

      - name: Ejecutar script de extracción
        run: node actualizar_onces.js

      - name: Subir cambios a GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add lineups.json
          git commit -m "Actualización automática de onces y lesiones [skip ci]" || exit 0
          git push